name: Daily anime quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update quote in README
        run: |
          python3 - <<'PY'
          import html, json, os, random, re, urllib.request

          REPO = os.environ.get("GITHUB_REPOSITORY", "unknown/unknown")
          UA = {"User-Agent": f"profile-readme-updater/1.0 (https://github.com/{REPO})"}

          # Fallback quotes used when the quote API fails
          FALLBACK = [
              ("Defy the heavens and rewrite your fate; never retreat.", "Self-written"),
              ("A steady dao heart stays unshaken even before demons.", "Self-written"),
              ("Every bug is a tribulation to overcome.", "Self-written"),
          ]

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()

          try:
              req = urllib.request.Request("https://api.animechan.io/v1/quotes/random", headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  q = json.load(r)["data"]
              content, who = q["content"], f'{q["character"]["name"]}, {q["anime"]["name"]}'
              print("Quote OK:", who)
          except Exception as e:
              print("Quote FAIL, using fallback:", e)
              content, who = random.choice(FALLBACK)

          block = (
              "\n<blockquote>\n"
              f'  <i>"{html.escape(content)}"</i><br>\n'
              f'  — <b>{html.escape(who)}</b>\n'
              "</blockquote>\n"
          )

          pattern = r"(<!-- QUOTE:START -->).*?(<!-- QUOTE:END -->)"
          if not re.search(pattern, readme, flags=re.S):
              raise SystemExit("Marker QUOTE not found in README.md")
          readme = re.sub(pattern, lambda m: m.group(1) + block + m.group(2), readme, flags=re.S)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "chore: update anime quote" && git push)